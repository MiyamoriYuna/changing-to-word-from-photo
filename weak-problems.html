<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>苦手問題 | 問題集ノート</title>
  <link rel="stylesheet" href="css/common.css">
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">問題集ノート</a>

    <nav>
      <a href="materials.html">教材</a>
      <a href="search.html">検索</a>
      <a href="weak-problems.html" class="active">苦手問題</a>
    </nav>
  </div>
</header>


<main class="container">

  <div class="page-header">
    <p class="section-label">REVIEW</p>
    <h1>苦手問題</h1>

    <p>
      過去に間違えた問題を絞り込んで、
      ランダムに復習できます。
    </p>
  </div>


  <section class="filter-card">

    <div class="filter-row">

      <div class="form-group">
        <label>教科</label>

        <select>
          <option>すべて</option>
          <option>数学</option>
          <option>英語</option>
          <option>化学</option>
        </select>
      </div>


      <div class="form-group">
        <label>単元</label>

        <select>
          <option>すべて</option>
          <option>二次方程式</option>
          <option>関係代名詞</option>
          <option>物質量</option>
        </select>
      </div>


      <div class="form-group">
        <label>出題数</label>

        <select>
          <option>5問</option>
          <option>10問</option>
          <option>20問</option>
        </select>
      </div>

    </div>


    <button class="button primary large-button">
      ランダム出題
    </button>

  </section>


  <section class="section">

    <div class="section-title">
      <div>
        <p class="section-label">WEAK POINTS</p>
        <h2>苦手な問題</h2>
      </div>

      <span>4問</span>
    </div>


    <div class="problem-list">

      <a href="#" class="problem-item">

        <div class="problem-number">01</div>

        <div class="problem-info">

          <div class="problem-meta">
            <span>数学</span>
            <span>二次方程式</span>
          </div>

          <h3>次の方程式を解きなさい。</h3>

        </div>

        <span class="result bad">2回 ×</span>

      </a>


      <a href="#" class="problem-item">

        <div class="problem-number">02</div>

        <div class="problem-info">

          <div class="problem-meta">
            <span>数学</span>
            <span>場合の数</span>
          </div>

          <h3>数字を並べてできる整数の個数を求めなさい。</h3>

        </div>

        <span class="result bad">3回 ×</span>

      </a>

    </div>

  </section>

</main>


<footer class="site-footer">
  <p>問題集ノート</p>
  <small>Study Management Tool</small>
</footer>

<script src="js/common.js"></script>

</body>
</html>
